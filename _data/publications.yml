  title: 'The impact of urban morphology on sunlight availability at urban and neighborhood scales: A systematic review'
  authors: Rostami, E., & Nasrollahi, N.
  journal: Sustainable Cities and Society, 121, 106194
  doi: https://doi.org/10.1016/j.scs.2025.106194
  abstract: Assessing sunlight conditions in urban environments is crucial, as high-quality natural light is essential for human health and well-being while supporting the production of clean and affordable energy. This systematic review examines the current state of research on solar access in urban and neighborhood contexts, identifying key variables and the impact of urban morphology on indoor natural light levels and outdoor solar energy potential. Using the PRISMA protocol, 202 articles were selected, categorized based on thematic and spatial classifications, and their validation methods critically assessed. Key findings from the reviewed articles regarding the impact of urban morphology on solar access are presented and categorized by theme. Finally, the dependent and independent variables in the studies and the validation results were analyzed. The findings indicate that most studies at the urban scale have focused more on outdoor solar energy potential, with fewer studies examining
    indoor natural light conditions. Building density emerged as the most frequently investigated morphological parameter. Additionally, the review highlights the scarcity of studies that simultaneously consider indoor and outdoor spaces and jointly assess indoor-outdoor solar performance. Although approximately 25% of the studies included validation procedures, direct comparisons were challenging due to the need for standardized validation protocols.
- year: 2024
  cover: energy-buildings-cover.jpg
  cover_alt: Energy and Buildings Journal Cover
  title: A comprehensive study of how urban morphological parameters impact the solar potential, energy consumption and daylight autonomy in canyons and buildings
  authors: Rostami, E., Nasrollahi, N., & Khodakarami, J.
  journal: Energy and Buildings, 305, 113904
  doi: https://doi.org/10.1016/j.enbuild.2024.113904
  abstract: Over the past two decades, global greenhouse gas emissions have surged, leading to rising sea levels and climate change. Solar energy has emerged as an excellent solution to this problem. This study aims to assess daylight availability and energy consumption in urban canyons and blocks in a semi-arid climate while exploring the correlation between the heterogeneity of urban morphological parameters and key research variables. The study employed field measurements and simulations using Ladybug Tools and UMI. Data were collected from urban canyons and blocks in three areas, amounting to 1,366,982 m2. The findings indicate that areas with abundant greenery and H/W ratios exceeding 1.8 experience the most significant shading effects in urban canyons. Selecting suitable trees and placing them in strategic locations can enhance energy efficiency. Furthermore, broad urban canyons (H/W < 0.5) receive four times more solar radiation than narrow urban canyons (H/W > 1.8) with high tree
    density, peaking at 240 kWh/m2 during summer. In urban blocks, rooftops have the highest solar potential, with imbalances between building heights and interbuilding shading as factors that reduce solar capabilities. Tree coverage significantly affects the solar potential of facades, with some urban blocks receiving less than 5,000 kWh/m2 of solar radiation on the southern facades each month. Finally, this study examined the impact of heterogeneity within urban morphological parameters on the principal research variables. The results indicate that the heterogeneity observed in urban morphological parameters affects daylight availability and energy consumption within urban blocks.
